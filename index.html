<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0d"><title>T1 ESPORTS ARENA</title>
<style>
:root{--bg:#09090b;--panel:#141417;--panel2:#1b1b20;--gold:#e8b84b;--gold2:#ffd978;--muted:#9a9aa3;--line:#2b2b31;--green:#5bd69a;--red:#ff7373}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#30240d 0,transparent 42%),var(--bg);color:#f5f3ed;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#0b0b0deF;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px max(16px,calc((100% - 1080px)/2));display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:.4px}.brand b{color:var(--gold)}.chip{border:1px solid #66501e;color:var(--gold2);border-radius:99px;padding:5px 10px;font-size:12px}
main{max-width:1080px;margin:auto;padding:18px 15px}.hero{background:linear-gradient(120deg,#28200f,#17130b 55%,#19191d);border:1px solid #57421b;border-radius:20px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}.hero:after{content:"FF";position:absolute;right:18px;top:-22px;font-size:130px;font-weight:1000;color:#ffffff09}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{font-size:clamp(27px,5vw,42px);line-height:1.1;margin:7px 0}.hero p{color:#c6c1b4;max-width:560px;margin:8px 0 18px}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:800;background:linear-gradient(135deg,var(--gold2),#c48a22);color:#211707}.btn.secondary{background:#26262c;color:#eee;border:1px solid #3a3a42}.btn.danger{background:#512326;color:#ffd9d9;border:1px solid #873a3f}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0 22px}.stat,.card,.panel{background:linear-gradient(145deg,#19191e,#111114);border:1px solid var(--line);border-radius:16px;padding:15px}.stat strong{display:block;font-size:22px;color:var(--gold2)}.stat span,.muted{color:var(--muted);font-size:12px}
h2{font-size:20px;margin:22px 0 12px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.filters{display:flex;gap:7px;overflow:auto;padding:3px 0 12px}.filter{white-space:nowrap;background:#18181d;border:1px solid var(--line);color:#ccc;border-radius:99px;padding:7px 12px;font-size:12px}.filter.active{background:#4a3715;color:var(--gold2);border-color:#8a6726}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.card{position:relative}.card h3{margin:4px 0 8px;font-size:17px}.tag{display:inline-block;font-size:10px;color:var(--gold2);background:#3b2d13;padding:3px 8px;border-radius:99px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}.meta div{background:#101014;padding:8px;border-radius:9px}.meta small{display:block;color:var(--muted);font-size:10px}.meta b{font-size:13px}.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}.progress{height:5px;background:#303037;border-radius:9px;margin:7px 0 12px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold);border-radius:9px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{padding:8px 12px;background:#17171c;border:1px solid var(--line);border-radius:9px;color:#bbb}.tab.active{border-color:#98722a;color:var(--gold2)}
.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;color:#c7c3b9}.field input,.field select,.field textarea{width:100%;background:#0c0c0f;color:#f5f3ed;border:1px solid #37373f;border-radius:9px;padding:10px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}.field textarea{min-height:76px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.wide{grid-column:1/-1}
.rowline{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}.status{font-size:11px;padding:4px 8px;border-radius:99px;background:#29292f;color:#ddd}.status.Pending{color:#ffd978;background:#443512}.status.Approved{color:#7ef0b1;background:#123b2b}.status.Rejected{color:#ff9999;background:#471f22}
.empty{text-align:center;color:var(--muted);padding:30px 12px}.hidden{display:none!important}.notice{background:#332b16;border:1px solid #70551d;color:#f7d98c;border-radius:10px;padding:10px 12px;font-size:12px;margin:12px 0}.dangertext{color:#ff9999}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:8;display:flex;justify-content:center;background:#101014ed;border-top:1px solid var(--line);backdrop-filter:blur(14px);padding:8px 5px calc(8px + env(safe-area-inset-bottom))}.nav{width:min(700px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{background:none;border:0;color:#8e8e98;font-size:10px;padding:5px 2px}.nav button span{display:block;font-size:19px}.nav button.active{color:var(--gold2)}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--gold2)}.tablewrap{overflow:auto}.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%);background:#24242a;border:1px solid #57575f;padding:10px 16px;border-radius:10px;z-index:20;box-shadow:0 10px 30px #0008;max-width:90%;text-align:center}

.announcement-banner{background:linear-gradient(110deg,#3b2d13,#17130b);border:1px solid #8a6726;border-radius:13px;padding:12px 14px;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.announcement-banner b{color:var(--gold2)}.announcement-banner p{margin:3px 0 0;color:#d0c7b5;font-size:12px}
.announcement-overlay{position:fixed;inset:0;background:#000b;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}
.announcement-modal{width:min(440px,100%);max-height:85vh;overflow:auto;background:linear-gradient(145deg,#1c1b1c,#0d0d10);border:1px solid #8a6726;border-radius:19px;padding:20px;box-shadow:0 20px 70px #000b}
.announcement-modal h2{color:var(--gold2);margin:4px 0 8px}.announcement-modal p{color:#d4d0c7;white-space:pre-wrap}.announcement-modal img{max-width:100%;border-radius:11px;margin:8px 0}
.announcement-list{display:grid;gap:9px}.announcement-item{background:#17171c;border:1px solid var(--line);border-radius:12px;padding:12px}

@media(max-width:520px){main{padding:13px}.hero{padding:19px}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:18px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:13px}}

.hero{background:linear-gradient(115deg,#241b0b 0%,#111115 62%,#1e1710 100%);border-color:#70531f}
.hero h1{letter-spacing:-1.2px}
.card{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-2px);border-color:#765a25;box-shadow:0 12px 28px #0005}
.chip{background:#201a10}
</style>
<style>
#t1-notification-bar{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:10px;
background:linear-gradient(90deg,#3a2a0b,#17130b);border-bottom:1px solid #806020;
padding:9px 14px;color:#ffe3a0;font:700 12px/1.4 system-ui;overflow:hidden}
#t1-notification-bar .t1-label{white-space:nowrap;color:#171008;background:#ffd978;border-radius:5px;padding:3px 7px}
#t1-notification-bar .t1-message{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#t1-notification-bar a{color:#fff0c5;text-decoration:underline;white-space:nowrap}
</style>

</head>
<body>

<div id="t1-notification-bar" role="status" aria-live="polite">
  <span class="t1-label">📢 UPDATE</span>
  <span class="t1-message" id="t1-notification-message">T1 ESPORTS ARENA — Tournament updates will appear here.</span>
  <a href="/payment/" aria-label="Payment page">Payment</a><a href="/admin/" aria-label="Admin panel">Admin</a>
</div>
<script>
(function(){
  try {
    const raw = localStorage.getItem('ff_arena_v1');
    const db = raw ? JSON.parse(raw) : null;
    const active = (db && Array.isArray(db.announcements) ? db.announcements : [])
      .filter(x => x && x.active).sort((a,b) => new Date(b.date)-new Date(a.date));
    if(active.length){
      const el=document.getElementById('t1-notification-message');
      if(el) el.textContent=active[0].title + ' — ' + active[0].message;
    }
  } catch(e) {}
})();
</script>

<header class="top"><div class="brand">🔥 <b>T1 ESPORTS ARENA</b><div style="font-size:10px;color:#9a9aa3;font-weight:500;letter-spacing:1px">BANGLADESH ESPORTS</div></div><span class="chip" id="topBalance">৳0.00</span></header>
<main id="app"></main>
<nav class="bottom"><div class="nav">
<button data-page="home" class="active"><span>⌂</span>Home</button><button data-page="wallet"><span>◈</span>Wallet</button><button data-page="results"><span>🏆</span>Results</button><button data-page="profile"><span>♙</span>Profile</button><button data-page="admin"><span>⚙</span>Admin</button>
</div></nav>
<div id="toast" class="toast hidden" role="status"></div>
<script>
(()=> {
const KEY='ff_arena_v1', CATS=['🔥 BR','⚔️ CS','🎯 CS 2v2','🐺 Lone Wolf','💥 Lose to Win','🏆 Pro League','🪂 BR Survival','🎮 Free Match'];
const money=n=>'৳'+Number(n||0).toFixed(2), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString().slice(0,16);
const seed=()=>({player:{name:'Guest Player',uid:'',phone:'',balance:0},tournaments:[
{id:1,name:'Friday Night Clash',category:CATS[0],entry:20,prize:500,date:'2026-11-20T20:00',slots:48,joined:7,rules:'No hacks, emulator or teaming. Be ready 10 minutes early.',room:'',pass:'',status:'Upcoming'},
{id:2,name:'Squad Rush Arena',category:CATS[1],entry:0,prize:250,date:'2026-11-21T19:30',slots:32,joined:12,rules:'Best of 3. Respect all players.',room:'',pass:'',status:'Upcoming'},
{id:3,name:'Duo Aim Masters',category:CATS[2],entry:10,prize:200,date:'2026-11-22T21:00',slots:24,joined:4,rules:'2v2 custom room.',room:'',pass:'',status:'Upcoming'},
{id:4,name:'Lone Wolf Challenge',category:CATS[3],entry:0,prize:100,date:'2026-11-23T20:00',slots:16,joined:2,rules:'1v1 elimination.',room:'',pass:'',status:'Upcoming'}
],registrations:[],requests:[],transactions:[],results:[],announcements:[],seenAnnouncements:[],nextId:10,admin:false});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}
db.announcements=db.announcements||[];db.seenAnnouncements=db.seenAnnouncements||[];
 let page='home',cat='All',walletTab='overview',adminTab='tournaments';
const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('topBalance').textContent=money(db.player.balance)};
const toast=m=>{let e=document.getElementById('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)};
const datefmt=s=>s?new Date(s).toLocaleString(): '—';
const nav=()=>{document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))};
const setPage=p=>{page=p;nav();render()};
const shell=(title,body)=>`<div class="sectionhead"><h2>${title}</h2></div>${body}`;
function tournamentCard(t){let mine=db.registrations.some(r=>r.tid===t.id&&r.uid===db.player.uid);let full=t.joined>=t.slots;return `<article class="card"><span class="tag">${esc(t.category)}</span><h3>${esc(t.name)}</h3><div class="meta"><div><small>ENTRY</small><b>${t.entry?money(t.entry):'FREE'}</b></div><div><small>PRIZE POOL</small><b>${money(t.prize)}</b></div><div><small>DATE & TIME</small><b>${esc(datefmt(t.date))}</b></div><div><small>SLOTS</small><b>${t.joined}/${t.slots}</b></div></div><div class="progress"><i style="width:${Math.min(100,t.joined/t.slots*100)}%"></i></div><div class="cardfoot"><span class="muted">${full?'FULL':`${t.slots-t.joined} slots left`}</span><button class="btn small" ${full||mine?'disabled':''} onclick="joinTournament(${t.id})">${mine?'Joined':full?'Full':'Join Tournament'}</button></div></article>`}
function home(){let list=db.tournaments.filter(t=>cat==='All'||t.category===cat);let active=db.announcements.filter(a=>a.active&&a.display!=='popup');return `${active.length?`<div class="announcement-banner"><div><b>📢 ${esc(active[0].title)}</b><p>${esc(active[0].message)}</p></div><button class="btn small" onclick="openAnnouncement(${active[0].id})">View</button></div>`:''}<section class="hero"><div class="eyebrow">BANGLADESH FREE FIRE TOURNAMENTS</div><h1>COMPETE.<br><span style="color:var(--gold2)">WIN. GET REWARDED.</span></h1><p>Join daily Solo, Duo and Squad matches. Use your wallet to enter tournaments, track match results and climb the winners leaderboard.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px"><span class="chip">🇧🇩 Bangladesh</span><span class="chip">⚡ Daily Matches</span><span class="chip">🏆 Live Results</span></div><button class="btn" onclick="document.getElementById('tournaments').scrollIntoView({behavior:'smooth'})">Find a Match →</button></section><div class="stats"><div class="stat"><strong>${db.tournaments.length}</strong><span>TOURNAMENTS</span></div><div class="stat"><strong>${db.registrations.filter(r=>r.uid===db.player.uid).length}</strong><span>MY JOINS</span></div><div class="stat"><strong>${money(db.player.balance)}</strong><span>WALLET</span></div></div><div class="cards" style="margin:0 0 20px"><div class="card"><span class="tag">01 · SIGN UP</span><h3>Create Player Profile</h3><div class="muted">Add your player name and Free Fire UID to get started.</div></div><div class="card"><span class="tag">02 · JOIN MATCH</span><h3>Choose Your Match</h3><div class="muted">Pick a category, check the entry fee and reserve an available slot.</div></div><div class="card"><span class="tag">03 · WIN REWARDS</span><h3>Track Your Results</h3><div class="muted">Check published rankings and prize information after matches.</div></div></div><div id="tournaments">${shell('Tournament Arena',`<div class="filters"><button class="filter ${cat==='All'?'active':''}" onclick="setCat('All')">All</button>${CATS.map(c=>`<button class="filter ${cat===c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}</div><div class="cards">${list.length?list.map(tournamentCard).join(''):'<div class="empty">No tournaments in this category yet.</div>'}</div>`)}</div>${announcementHistory()}`}
function wallet(){let mine=db.requests.filter(r=>r.uid===db.player.uid);return `<div class="panel"><div class="eyebrow">PLAYER WALLET</div><div style="font-size:13px;color:var(--muted)">Available balance</div><div style="font-size:34px;font-weight:900;color:var(--gold2)">${money(db.player.balance)}</div><div class="tabs"><button class="tab ${walletTab==='overview'?'active':''}" onclick="walletTab='overview';render()">Overview</button><button class="tab ${walletTab==='deposit'?'active':''}" onclick="walletTab='deposit';render()">Deposit</button><button class="tab ${walletTab==='withdraw'?'active':''}" onclick="walletTab='withdraw';render()">Withdraw</button></div></div>${walletTab==='overview'?`<div class="notice">Prototype only: payment requests are simulated. Never send money based only on this demo. Admin approval is manual.</div>${shell('Transaction history',historyRows(db.transactions.filter(t=>t.uid===db.player.uid)))}${shell('Payment requests',requestRows(mine))}`:walletForm(walletTab)}`}
function historyRows(rows){return rows.length?rows.slice().reverse().map(t=>`<div class="rowline"><div><b>${esc(t.type)} • ${esc(t.method||'Wallet')}</b><div class="muted">${esc(t.ref||'')} · ${datefmt(t.date)}</div></div><b>${money(t.amount)}</b></div>`).join(''):'<div class="empty">No transactions yet.</div>'}
function requestRows(rows){return rows.length?rows.slice().reverse().map(r=>`<div class="rowline"><div><b>${esc(r.type)} ${money(r.amount)}</b><div class="muted">${esc(r.method)} · ${esc(r.reference||'')}</div></div><span class="status ${r.status}">${r.status}</span></div>`).join(''):'<div class="empty">No requests yet.</div>'}
function walletForm(type){return `<div class="panel"><h2>${type==='deposit'?'Request a deposit':'Request a withdrawal'}</h2><form onsubmit="submitWallet(event,'${type}')"><div class="field"><label>Amount (BDT)</label><input name="amount" type="number" min="1" step="0.01" required></div><div class="field"><label>Payment method</label><select name="method" required><option value="">Select method</option><option>bKash</option><option>Nagad</option><option>Rocket</option><option>Binance Pay</option></select></div><div class="field"><label>${type==='deposit'?'Sender number / Binance Pay details':'Receiver number / Binance Pay ID'}</label><input name="account" required maxlength="100" placeholder="Enter payment details"></div><div class="field"><label>${type==='deposit'?'Transaction ID / payment reference':'Reason or reference (optional)'}</label><input name="reference" maxlength="120" ${type==='deposit'?'required':''}></div><button class="btn" type="submit">Submit ${type} request</button></form><div class="notice">Never enter passwords, OTPs, seed phrases or private keys. Binance Pay availability depends on local law and provider support. Any crypto transfer must use an explicitly verified asset and exact network.</div></div>`}
function results(){return shell('Results & Leaderboard',db.results.length?`<div class="cards">${db.results.slice().reverse().map(r=>`<div class="card"><span class="tag">${esc(r.category||'Tournament result')}</span><h3>${esc(r.name)}</h3><div class="muted">${esc(r.date||'')}</div><div class="tablewrap"><table><thead><tr><th>Rank</th><th>Player</th><th>Kills</th><th>Position</th><th>Total</th><th>Prize</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${esc(x.rank)}</td><td>${esc(x.player)}</td><td>${esc(x.kills)}</td><td>${esc(x.position)}</td><td><b>${esc(x.total)}</b></td><td>${esc(x.prize)}</td></tr>`).join('')}</tbody></table></div></div>`).join('')}</div>`:'<div class="empty">No results published yet.</div>')}
function profile(){let joined=db.registrations.filter(r=>r.uid===db.player.uid);return `<div class="panel"><div class="eyebrow">PLAYER PROFILE</div><h2>${esc(db.player.name||'Guest Player')}</h2><div class="muted">Free Fire UID: ${esc(db.player.uid||'Not set')}</div><div class="muted">Phone: ${esc(db.player.phone||'Not set')}</div><h2>Update profile</h2><form onsubmit="saveProfile(event)"><div class="field"><label>Player name</label><input name="name" required maxlength="40" value="${esc(db.player.name)}"></div><div class="field"><label>Free Fire UID</label><input name="uid" required maxlength="30" value="${esc(db.player.uid)}"></div><div class="field"><label>Phone number</label><input name="phone" maxlength="20" value="${esc(db.player.phone)}"></div><button class="btn">Save profile</button></form></div>${shell('Joined tournaments',joined.length?joined.map(r=>{let t=db.tournaments.find(t=>t.id===r.tid);return `<div class="rowline"><div><b>${esc(t?.name||'Tournament')}</b><div class="muted">${datefmt(r.date)}</div></div><span class="status">${esc(r.status||'Registered')}</span></div>`}).join(''):'<div class="empty">No joined tournaments yet.</div>')}`}
function admin(){if(!db.admin)return `<div class="panel"><div class="eyebrow">RESTRICTED AREA</div><h2>Admin sign in</h2><div class="notice">Demo PIN: <b>246810</b>. This client-side PIN is only for local prototype testing and is not secure.</div><form onsubmit="adminLogin(event)"><div class="field"><label>Admin PIN</label><input name="pin" type="password" inputmode="numeric" required></div><button class="btn">Unlock admin panel</button></form></div>`;return `<div class="sectionhead"><h2>Admin Control Center</h2><button class="btn danger small" onclick="db.admin=false;save();render()">Logout</button></div><div class="tabs">${[['tournaments','Tournaments'],['requests','Wallet requests'],['players','Players'],['results','Publish results'],['notifications','Notifications']].map(([k,v])=>`<button class="tab ${adminTab===k?'active':''}" onclick="adminTab='${k}';render()">${v}</button>`).join('')}</div>${adminTab==='tournaments'?adminTournaments():adminTab==='requests'?adminRequests():adminTab==='players'?adminPlayers():adminTab==='notifications'?adminNotifications():adminResults()}`}
function adminTournaments(){return `<div class="panel"><h3>Create tournament</h3><form onsubmit="createTournament(event)"><div class="formgrid"><div class="field"><label>Tournament name</label><input name="name" required></div><div class="field"><label>Category</label><select name="category">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Entry fee (0 = free)</label><input name="entry" type="number" min="0" step=".01" required></div><div class="field"><label>Prize pool</label><input name="prize" type="number" min="0" step=".01" required></div><div class="field"><label>Date & time</label><input name="date" type="datetime-local" required></div><div class="field"><label>Total player slots</label><input name="slots" type="number" min="1" max="1000" required></div><div class="field"><label>Room ID</label><input name="room"></div><div class="field"><label>Room password</label><input name="pass"></div><div class="field wide"><label>Rules</label><textarea name="rules"></textarea></div></div><button class="btn">Create tournament</button></form></div><h3>Manage tournaments</h3>${db.tournaments.map(t=>`<div class="rowline"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.category)} · ${t.joined}/${t.slots} slots</div></div><button class="btn danger small" onclick="deleteTournament(${t.id})">Delete</button></div>`).join('')||'<div class="empty">No tournaments.</div>'}`}
function adminRequests(){return db.requests.length?db.requests.slice().reverse().map(r=>`<div class="card" style="margin-bottom:10px"><div class="sectionhead"><b>${esc(r.type)} · ${money(r.amount)}</b><span class="status ${r.status}">${r.status}</span></div><div class="muted">UID ${esc(r.uid)} · ${esc(r.method)} · ${datefmt(r.date)}</div><div class="muted">Account: ${esc(r.account)} | Ref: ${esc(r.reference||'—')}</div>${r.status==='Pending'?`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn small" onclick="reviewRequest(${r.id},'Approved')">Approve</button><button class="btn danger small" onclick="reviewRequest(${r.id},'Rejected')">Reject</button></div>`:''}</div>`).join(''):'<div class="empty">No wallet requests.</div>'}
function adminPlayers(){let u=[...new Set(db.registrations.map(r=>r.uid).concat(db.player.uid||[]).filter(Boolean))];return `<div class="tablewrap"><table><thead><tr><th>UID</th><th>Current player</th><th>Balance (this device)</th><th>Registrations</th></tr></thead><tbody>${u.map(uid=>`<tr><td>${esc(uid)}</td><td>${uid===db.player.uid?esc(db.player.name):'Player'}</td><td>${uid===db.player.uid?money(db.player.balance):'—'}</td><td>${db.registrations.filter(r=>r.uid===uid).length}</td></tr>`).join('')}</tbody></table></div><div class="notice">Local prototype stores only this browser's player record. A real admin dashboard must read authorized user records from the backend.</div>`}
function adminResults(){return `<div class="panel"><h3>Publish tournament results</h3><form onsubmit="publishResult(event)"><div class="field"><label>Tournament / event name</label><input name="name" required></div><div class="field"><label>Category</label><select name="category">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Leaderboard rows (one per line: rank,player,kills,position,total,prize)</label><textarea name="rows" required placeholder="1,PlayerOne,8,12,20,৳500&#10;2,PlayerTwo,5,10,15,৳200"></textarea></div><button class="btn">Publish results</button></form></div>`}

function adminNotifications(){return `<div class="panel"><h3>📢 Publish announcement</h3><form onsubmit="publishAnnouncement(event)"><div class="field"><label>Notification title</label><input name="title" maxlength="80" required placeholder="e.g. New tournament update"></div><div class="field"><label>Message</label><textarea name="message" maxlength="1000" required placeholder="Write your update for all players..."></textarea></div><div class="field"><label>Image URL (optional)</label><input name="image" type="url" placeholder="https://..."></div><div class="field"><label>Action link (optional)</label><input name="link" type="url" placeholder="https://..."></div><div class="field"><label>Display type</label><select name="display"><option value="both">Popup + Banner + History</option><option value="popup">Popup + History</option><option value="banner">Banner + History</option></select></div><div class="field"><label><input type="checkbox" name="active" checked style="width:auto"> Publish immediately</label></div><button class="btn">Publish update</button></form><div class="notice">Prototype mode: updates are saved only in this browser. Supabase is required to sync to every player. Firebase Cloud Messaging (FCM) and a secure server are required for phone push notifications.</div></div><h3>Published updates</h3><div class="announcement-list">${db.announcements.slice().reverse().map(a=>`<div class="announcement-item"><div class="sectionhead"><b>${esc(a.title)}</b><span class="status ${a.active?'Approved':'Rejected'}">${a.active?'Active':'Hidden'}</span></div><p class="muted">${esc(a.message)}</p><div class="muted">${datefmt(a.date)} · ${esc(a.display||'both')}</div><div style="display:flex;gap:8px;margin-top:9px"><button class="btn secondary small" onclick="toggleAnnouncement(${a.id})">${a.active?'Hide':'Publish'}</button><button class="btn danger small" onclick="deleteAnnouncement(${a.id})">Delete</button></div></div>`).join('')||'<div class="empty">No announcements yet.</div>'}</div>`}
function announcementHistory(){let visible=db.announcements.filter(a=>a.active);return `<div>${shell('📢 Updates & Notifications',visible.slice().reverse().map(a=>`<div class="announcement-item"><b>${esc(a.title)}</b><p>${esc(a.message)}</p>${a.image?`<img src="${esc(a.image)}" alt="Update image" style="max-width:100%;border-radius:10px" onerror="this.style.display='none'">`:''}<div class="muted">${datefmt(a.date)}</div>${a.link?`<a href="${esc(a.link)}" target="_blank" rel="noopener" class="btn small" style="display:inline-block;text-decoration:none;margin-top:8px">Open update ↗</a>`:''}${a.display!=='banner'?`<button class="btn secondary small" onclick="openAnnouncement(${a.id})" style="margin-top:8px">View popup</button>`:''}</div>`).join('')||'<div class="empty">No updates available.</div>')}</div>`}
window.publishAnnouncement=e=>{e.preventDefault();let f=new FormData(e.target);db.announcements.push({id:db.nextId++,title:String(f.get('title')).trim(),message:String(f.get('message')).trim(),image:String(f.get('image')||'').trim(),link:String(f.get('link')||'').trim(),display:f.get('display')||'both',active:f.get('active')==='on',date:new Date().toISOString()});save();toast('Announcement published on this device.');render()};
window.toggleAnnouncement=id=>{let a=db.announcements.find(x=>x.id===id);if(a){a.active=!a.active;save();render()}};
window.deleteAnnouncement=id=>{if(confirm('Delete this announcement?')){db.announcements=db.announcements.filter(a=>a.id!==id);save();render()}};
window.openAnnouncement=id=>{let a=db.announcements.find(x=>x.id===id);if(!a)return;let old=document.getElementById('announcementOverlay');if(old)old.remove();let overlay=document.createElement('div');overlay.id='announcementOverlay';overlay.className='announcement-overlay';overlay.innerHTML=`<div class="announcement-modal"><div class="eyebrow">📢 T1 ESPORTS ARENA UPDATE</div><h2>${esc(a.title)}</h2>${a.image?`<img src="${esc(a.image)}" alt="Announcement image" onerror="this.style.display='none'">`:''}<p>${esc(a.message)}</p>${a.link?`<a class="btn" href="${esc(a.link)}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">Open Link ↗</a>`:''}<button class="btn secondary" style="width:100%;margin-top:12px" onclick="document.getElementById('announcementOverlay').remove()">Close</button></div>`;overlay.addEventListener('click',ev=>{if(ev.target===overlay)overlay.remove()});document.body.appendChild(overlay)};

function render(){save();let el=document.getElementById('app');el.innerHTML=page==='home'?home():page==='wallet'?wallet():page==='results'?results():page==='profile'?profile():admin();nav()}
window.setCat=c=>{cat=c;render()};
window.joinTournament=id=>{let t=db.tournaments.find(x=>x.id===id);if(!t)return;if(!db.player.name||!db.player.uid){toast('Complete your player profile first.');setPage('profile');return}if(db.registrations.some(r=>r.tid===id&&r.uid===db.player.uid)){toast('You are already registered.');return}if(t.joined>=t.slots){toast('Tournament is full.');return}if(db.player.balance<t.entry){toast('Insufficient wallet balance.');return}if(t.entry){db.player.balance-=t.entry;db.transactions.push({id:db.nextId++,uid:db.player.uid,type:'Tournament entry',amount:-t.entry,method:'Wallet',ref:t.name,date:new Date().toISOString()})}t.joined++;db.registrations.push({id:db.nextId++,tid:id,uid:db.player.uid,player:db.player.name,date:new Date().toISOString(),status:'Registered'});save();toast('Tournament joined successfully!');render()};
window.saveProfile=e=>{e.preventDefault();let f=new FormData(e.target);db.player.name=f.get('name').trim();db.player.uid=f.get('uid').trim();db.player.phone=f.get('phone').trim();save();toast('Profile saved.');render()};
window.walletTab='overview';
window.submitWallet=(e,type)=>{e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount')),method=f.get('method'),reference=String(f.get('reference')||'').trim();if(!db.player.uid){toast('Set your Free Fire UID in Profile first.');return}if(!Number.isFinite(amount)||amount<=0){toast('Enter a valid amount.');return}if(type==='withdraw'&&amount>db.player.balance){toast('Insufficient wallet balance.');return}if(type==='deposit'&&db.requests.some(r=>r.uid===db.player.uid&&r.type==='Deposit'&&r.reference===reference)){toast('Duplicate deposit reference.');return}if(type==='withdraw'){db.player.balance-=amount;db.transactions.push({id:db.nextId++,uid:db.player.uid,type:'Withdrawal hold',amount:-amount,method,ref:'Pending request',date:new Date().toISOString()})}db.requests.push({id:db.nextId++,uid:db.player.uid,type:type==='deposit'?'Deposit':'Withdraw',amount,method,account:String(f.get('account')).trim(),reference,status:'Pending',date:new Date().toISOString()});save();toast('Request submitted for admin review.');walletTab='overview';render()};
window.adminLogin=e=>{e.preventDefault();if(new FormData(e.target).get('pin')==='246810'){db.admin=true;save();toast('Admin panel unlocked on this device.');render()}else toast('Incorrect PIN.')};
window.createTournament=e=>{e.preventDefault();let f=new FormData(e.target),slots=Number(f.get('slots'));if(slots<1)return;db.tournaments.push({id:db.nextId++,name:String(f.get('name')).trim(),category:f.get('category'),entry:Number(f.get('entry')),prize:Number(f.get('prize')),date:f.get('date'),slots,joined:0,room:f.get('room'),pass:f.get('pass'),rules:f.get('rules'),status:'Upcoming'});save();toast('Tournament created.');render()};
window.deleteTournament=id=>{if(!confirm('Delete this tournament? Existing registration history will remain.'))return;db.tournaments=db.tournaments.filter(t=>t.id!==id);save();render()};
window.reviewRequest=(id,status)=>{let r=db.requests.find(x=>x.id===id);if(!r||r.status!=='Pending')return;if(status==='Approved'){if(r.type==='Deposit'){db.player.balance+=r.amount;db.transactions.push({id:db.nextId++,uid:r.uid,type:'Deposit approved',amount:r.amount,method:r.method,ref:r.reference,date:new Date().toISOString()})}else{db.transactions.push({id:db.nextId++,uid:r.uid,type:'Withdrawal approved',amount:0,method:r.method,ref:r.reference,date:new Date().toISOString()})}}else if(r.type==='Withdraw'){db.player.balance+=r.amount;db.transactions.push({id:db.nextId++,uid:r.uid,type:'Withdrawal released',amount:r.amount,method:r.method,ref:'Rejected request refund',date:new Date().toISOString()})}r.status=status;save();toast('Request '+status.toLowerCase()+'.');render()};
window.publishResult=e=>{e.preventDefault();let f=new FormData(e.target),rows=String(f.get('rows')).split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{let [rank,player,kills,position,total,prize]=line.split(',');return{rank,player,kills,position,total,prize}});if(!rows.length){toast('Add at least one result row.');return}db.results.push({id:db.nextId++,name:f.get('name'),category:f.get('category'),date:new Date().toLocaleDateString(),rows});save();toast('Results published.');render()};
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
save();render();
})();
</script></body></html>
